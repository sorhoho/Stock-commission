[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-query-service"
version = "0.1.0"
description = "CQRS read-model service for TMF637 stock availability queries — Redis-backed, Kafka-driven"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiokafka>=0.10",
    "redis[hiredis]>=5.0",
    "structlog>=24.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "tenacity>=8.3",
    "telco-common @ file:///app/shared/telco-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "fakeredis[aioredis]>=2.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
