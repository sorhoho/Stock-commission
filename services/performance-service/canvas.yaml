apiVersion: oda.tmforum.org/v1beta3
kind: component
metadata:
  name: performance-management
  labels:
    oda.tmforum.org/componentName: performance-management
spec:
  type: Performance Management
  version: "1.0.0"
  description: "Tracks and reports dealer and channel sales performance metrics across the telco distribution network."
  maintainers:
    - name: "Telco Distribution Platform"
      email: "platform@example.com"
  owners:
    - name: "Telco Distribution Platform"
      email: "platform@example.com"
  coreFunction:
    exposedAPIs:
      - name: TMF628-PerformanceManagement
        specification: "https://tmforum.org/oda/open-api/TMF628"
        implementation: "/api/v1/performanceManagement"
        path: "/api/v1/performanceManagement"
        port: 8005
        required: true
        resources: []
    dependentAPIs: []
  eventNotification:
    publishedEvents: []
    subscribedEvents:
      - name: telco.sales.sellout.completed
        href: "https://tmforum.org/oda/notification/telco.sales.sellout.completed"
  management: []
  security:
    controllerRole: "PLATFORM"
