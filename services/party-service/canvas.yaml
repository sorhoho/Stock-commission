apiVersion: oda.tmforum.org/v1beta3
kind: component
metadata:
  name: party-management
  labels:
    oda.tmforum.org/componentName: party-management
spec:
  type: Party Management
  version: "1.0.0"
  description: "Manages party entities including dealers, distributors, and customers in the telco distribution platform."
  maintainers:
    - name: "Telco Distribution Platform"
      email: "platform@example.com"
  owners:
    - name: "Telco Distribution Platform"
      email: "platform@example.com"
  coreFunction:
    exposedAPIs:
      - name: TMF632-PartyManagement
        specification: "https://tmforum.org/oda/open-api/TMF632"
        implementation: "/api/v1/partyManagement"
        path: "/api/v1/partyManagement"
        port: 8002
        required: true
        resources: []
    dependentAPIs: []
  eventNotification:
    publishedEvents:
      - name: telco.party.dealer.onboarded
        href: "https://tmforum.org/oda/notification/telco.party.dealer.onboarded"
    subscribedEvents: []
  management: []
  security:
    controllerRole: "PLATFORM"
