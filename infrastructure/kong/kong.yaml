_format_version: "3.0"
_transform: true

services:
  - name: inventory-service
    url: http://inventory-service:8000
    routes:
      - name: inventory-routes
        paths: ["/api/v1/inventory"]
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: kid
      - name: rate-limiting
        config:
          minute: 300
          policy: redis
          redis_host: redis
          redis_port: 6379
      - name: request-id
        config:
          header_name: X-Correlation-ID
          echo_downstream: true
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Service-Name:inventory-service"

  - name: party-service
    url: http://party-service:8000
    routes:
