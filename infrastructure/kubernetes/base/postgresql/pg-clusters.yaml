---
# Inventory DB cluster (CloudNativePG)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-inventory
  namespace: telco-inventory
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  storage:
    size: 50Gi
    storageClass: standard
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      work_mem: "4MB"
      wal_level: logical
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://telco-db-backups/inventory"
      s3Credentials:
        accessKeyId:
          name: s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-creds
          key: SECRET_ACCESS_KEY
  bootstrap:
    initdb:
      database: inventory
      owner: appuser
      secret:
        name: pg-inventory-creds
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-commission
  namespace: telco-commission
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 100Gi
    storageClass: standard
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      wal_level: logical
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://telco-db-backups/commission"
      s3Credentials:
        accessKeyId:
          name: s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-creds
          key: SECRET_ACCESS_KEY
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
