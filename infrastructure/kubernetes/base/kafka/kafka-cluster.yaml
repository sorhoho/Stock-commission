apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: telco-kafka
  namespace: telco-infra
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
      log.retention.hours: 168
      log.retention.check.interval.ms: 300000
      auto.create.topics.enable: "false"
      compression.type: gzip
    storage:
      type: persistent-claim
      size: 100Gi
      class: standard
      deleteClaim: false
    resources:
      requests:
        memory: 2Gi
        cpu: "500m"
      limits:
        memory: 4Gi
        cpu: "2000m"
    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values: [telco-kafka-kafka]
                topologyKey: kubernetes.io/hostname
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
      class: standard
      deleteClaim: false
    resources:
      requests:
        memory: 512Mi
        cpu: "250m"
      limits:
        memory: 1Gi
        cpu: "500m"
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: telco-sales-sellout-completed
  namespace: telco-infra
  labels:
    strimzi.io/cluster: telco-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "220752000000"  # 7 years (financial)
    min.insync.replicas: "2"
    compression.type: gzip
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: telco-commission-event-calculated
  namespace: telco-infra
  labels:
    strimzi.io/cluster: telco-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "220752000000"  # 7 years
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: telco-inventory-stock-transferred
  namespace: telco-infra
  labels:
    strimzi.io/cluster: telco-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "63072000000"  # 2 years
    min.insync.replicas: "2"
